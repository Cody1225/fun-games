<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>牛頓躲蘋果 - Newton Dodging Apples</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MediaPipe Face Mesh & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #1a120b;
            color: #fff8f0;
            user-select: none;
            touch-action: manipulation;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        .font-game {
            font-family: 'Fredoka One', 'Noto Sans TC', cursive;
        }

        /* 復古黑板面板 */
        .chalkboard-panel {
            background: rgba(35, 25, 18, 0.92);
            border: 3px solid #d4a373;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 0 15px rgba(212, 163, 115, 0.15);
            backdrop-filter: blur(8px);
        }

        .retro-btn {
            background: linear-gradient(135deg, #e63946, #b71c1c);
            border: 2px solid #ffb703;
            box-shadow: 0 5px 0 #800f2f;
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .retro-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #800f2f;
        }

        /* 水平鏡像 flip */
        .mirror-canvas {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2 sm:p-4 relative">

    <!-- 頂部 HUD 狀態欄 -->
    <header class="w-full max-w-3xl flex justify-between items-center px-3 py-2 chalkboard-panel rounded-2xl z-10 shrink-0 mb-1">
        <div class="flex items-center space-x-2">
            <h1 class="text-lg sm:text-2xl font-black text-amber-300 font-game tracking-wider">🍎 牛頓躲蘋果</h1>
        </div>
        
        <!-- HUD 資訊：生命值、生存時間 -->
        <div class="flex items-center space-x-3 sm:space-x-6 font-game">
            <div class="flex items-center space-x-1" id="lives-container">
                <i class="fa-solid fa-heart text-red-500 text-base sm:text-xl animate-pulse"></i>
                <i class="fa-solid fa-heart text-red-500 text-base sm:text-xl animate-pulse"></i>
                <i class="fa-solid fa-heart text-red-500 text-base sm:text-xl animate-pulse"></i>
            </div>
            <div class="text-right">
                <div class="text-[10px] sm:text-xs text-amber-200/80 uppercase tracking-widest">時間</div>
                <div id="timer-display" class="text-base sm:text-2xl font-bold text-yellow-400">00:00.00</div>
            </div>
        </div>
    </header>

    <!-- 遊戲主畫面區域 (自動彈性適應 Mobile/Desktop 螢幕高度) -->
    <main class="relative w-full max-w-3xl flex-1 chalkboard-panel rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl flex items-center justify-center border-2 sm:border-4 border-amber-700/60 min-h-0">
        <!-- 隱藏 WebCam Video 元素 -->
        <video id="webcam" class="hidden" playsinline muted></video>
        
        <!-- 遊戲主 Canvas (加鏡像 style) -->
        <canvas id="gameCanvas" class="w-full h-full object-cover mirror-canvas"></canvas>

        <!-- 開始遊戲 Modal -->
        <div id="start-modal" class="absolute inset-0 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center z-30 overflow-y-auto">
            <div class="max-w-md w-full bg-amber-950/95 border-2 border-amber-500/50 p-5 sm:p-7 rounded-3xl shadow-2xl space-y-4 my-auto">
                <div class="text-4xl sm:text-6xl animate-bounce">🧑‍🦱🍎</div>
                <h2 class="text-xl sm:text-3xl font-black text-amber-300 font-game">保護牛頓的假髮！</h2>
                <p class="text-xs sm:text-sm text-amber-100/90 leading-relaxed">
                    請開啟鏡頭權限，遊戲將即時辨識您的頭部並帶上<span class="text-yellow-400 font-bold">牛頓假髮</span>。<br>
                    左右移動頭部，避免被上方隨機掉落的蘋果砸中！
                </p>
                <div class="bg-amber-900/50 p-2.5 sm:p-3 rounded-xl text-left text-xs text-amber-200/90 space-y-1 border border-amber-700/40">
                    <p><i class="fa-solid fa-heart text-red-400 mr-1.5"></i>生命：共 3 條生命</p>
                    <p><i class="fa-solid fa-gauge-high text-yellow-400 mr-1.5"></i>難度：撐越久蘋果掉越快</p>
                    <p><i class="fa-solid fa-shield text-green-400 mr-1.5"></i>隱私：畫面僅在本地分析，不傳輸</p>
                </div>
                <button id="start-btn" type="button" class="retro-btn w-full py-3.5 sm:py-4 rounded-2xl text-base sm:text-xl font-bold font-game text-white flex items-center justify-center space-x-2 active:scale-95">
                    <i class="fa-solid fa-camera"></i>
                    <span>開啟鏡頭，開始挑戰！</span>
                </button>
            </div>
        </div>

        <!-- 載入動畫 Overlay -->
        <div id="loading-overlay" class="hidden absolute inset-0 bg-black/85 flex flex-col items-center justify-center z-40 space-y-4 p-4 text-center">
            <div class="w-12 h-12 sm:w-16 sm:h-16 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
            <p id="loading-text" class="text-amber-300 text-sm sm:text-lg font-bold font-game">正在啟動 FaceMesh 辨識模型...</p>
        </div>

        <!-- 遊戲結束 Modal -->
        <div id="gameover-modal" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center z-30 overflow-y-auto">
            <div class="max-w-md w-full bg-amber-950/95 border-2 border-red-500/60 p-5 sm:p-7 rounded-3xl shadow-2xl space-y-4 my-auto">
                <div class="text-4xl text-red-500 animate-pulse"><i class="fa-solid fa-skull-crossbones"></i></div>
                <h2 class="text-2xl sm:text-3xl font-black text-red-400 font-game">頭髮被蘋果砸爆了！</h2>
                
                <div class="bg-black/40 p-3.5 rounded-2xl border border-amber-600/30 space-y-1">
                    <div class="text-[10px] sm:text-xs text-amber-300/80 font-bold uppercase tracking-widest">生存時間</div>
                    <div id="final-time" class="text-2xl sm:text-3xl font-black text-yellow-400 font-game">00:00.00</div>
                    <div class="text-xs sm:text-sm font-bold text-amber-200 mt-1" id="rank-badge">稱號：載入中...</div>
                </div>

                <p id="rank-desc" class="text-xs text-amber-100/80 italic bg-amber-900/30 p-2.5 rounded-xl border border-amber-800/40">
                    "地心引力真可怕..."
                </p>

                <button id="restart-btn" type="button" class="retro-btn w-full py-3.5 rounded-2xl text-base sm:text-lg font-bold font-game text-white flex items-center justify-center space-x-2 active:scale-95">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>再試一次</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="mt-1 text-[10px] sm:text-xs text-amber-200/50 text-center font-medium shrink-0">
        牛頓躲蘋果 · AI Face Detection Powered by MediaPipe
    </footer>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('gameCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const startModal = document.getElementById('start-modal');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const gameoverModal = document.getElementById('gameover-modal');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const timerDisplay = document.getElementById('timer-display');
        const livesContainer = document.getElementById('lives-container');
        const finalTimeDisplay = document.getElementById('final-time');
        const rankBadge = document.getElementById('rank-badge');
        const rankDesc = document.getElementById('rank-desc');

        let gameState = 'IDLE'; // IDLE, LOADING, PLAYING, GAMEOVER
        let lives = 3;
        let startTime = 0;
        let elapsedTime = 0;
        let animationFrameId = null;
        let camera = null;
        let faceMesh = null;

        // 頭部及假髮資訊
        let headPos = { x: 0, y: 0, width: 0, height: 0, angle: 0, detected: false };
        let smoothedHead = { x: 0, y: 0, width: 0, angle: 0 };

        // 蘋果物件與掉落速度控制
        let apples = [];
        let lastSpawnTime = 0;
        let spawnInterval = 1100;
        let baseAppleSpeed = 3.2;
        let particles = [];

        function resizeCanvas() {
            const container = canvasElement.parentElement;
            if (!container) return;
            const dpr = window.devicePixelRatio || 1;
            canvasElement.width = container.clientWidth * dpr;
            canvasElement.height = container.clientHeight * dpr;
            canvasCtx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));
        resizeCanvas();

        function drawNewtonWig(ctx, x, y, width, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const scale = width / 180;
            ctx.scale(scale, scale);

            // 陰影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;

            // 蓬鬆捲髮結構
            ctx.fillStyle = '#f0f0f0';
            ctx.strokeStyle = '#c0c0c0';
            ctx.lineWidth = 3;

            const curls = [
                {cx: -60, cy: 0, r: 32}, {cx: -80, cy: 25, r: 28}, {cx: -75, cy: 55, r: 24}, {cx: -55, cy: 75, r: 20},
                {cx: 60, cy: 0, r: 32}, {cx: 80, cy: 25, r: 28}, {cx: 75, cy: 55, r: 24}, {cx: 55, cy: 75, r: 20},
                {cx: -35, cy: -30, r: 35}, {cx: 0, cy: -40, r: 40}, {cx: 35, cy: -30, r: 35},
                {cx: -20, cy: -15, r: 30}, {cx: 20, cy: -15, r: 30}
            ];

            curls.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            // 高光細節
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            curls.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.cx - c.r*0.2, c.cy - c.r*0.2, c.r * 0.6, Math.PI * 1.1, Math.PI * 1.7);
                ctx.stroke();
            });

            ctx.restore();
        }

        function drawApple(ctx, apple) {
            ctx.save();
            ctx.translate(apple.x, apple.y);
            ctx.rotate(apple.rotation);

            const r = apple.radius;

            // 蘋果本體
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r);
            grad.addColorStop(0, '#ff6b6b');
            grad.addColorStop(0.8, '#ee5253');
            grad.addColorStop(1, '#c0392b');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#801010';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 蘋果梗
            ctx.beginPath();
            ctx.moveTo(0, -r + 2);
            ctx.quadraticCurveTo(5, -r - 10, 8, -r - 14);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#5d4037';
            ctx.stroke();

            // 綠葉
            ctx.beginPath();
            ctx.ellipse(5, -r - 8, 6, 3.5, Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = '#2ecc71';
            ctx.fill();

            // 高光
            ctx.beginPath();
            ctx.arc(-r * 0.35, -r * 0.35, r * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fill();

            ctx.restore();
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 4,
                    color: Math.random() > 0.3 ? '#e63946' : '#ffb703',
                    alpha: 1,
                    life: 1.0
                });
            }
        }

        function updateAndDrawParticles(ctx) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.alpha -= 0.035;
                
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function onFaceMeshResults(results) {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                const topHead = landmarks[10];
                const leftFace = landmarks[234];
                const rightFace = landmarks[454];

                const container = canvasElement.parentElement;
                const renderW = container.clientWidth;
                const renderH = container.clientHeight;

                // 由於 Canvas CSS 設定了 scaleX(-1) 進行視覺鏡像，
                // 計算 X 座標時保持原始 x * renderW，便能與圖像呈現完全正確一致的移動方向！
                const x = topHead.x * renderW;
                const y = topHead.y * renderH;

                const faceWidth = Math.hypot(
                    (leftFace.x - rightFace.x) * renderW,
                    (leftFace.y - rightFace.y) * renderH
                );

                const dx = (rightFace.x - leftFace.x) * renderW;
                const dy = (rightFace.y - leftFace.y) * renderH;
                const angle = Math.atan2(dy, dx);

                headPos = {
                    x: x,
                    y: y - faceWidth * 0.22,
                    width: faceWidth * 1.55,
                    height: faceWidth * 1.2,
                    angle: angle,
                    detected: true
                };
            } else {
                headPos.detected = false;
            }
        }

        async function initCameraAndFaceMesh() {
            loadingOverlay.classList.remove('hidden');
            loadingText.innerText = "正在請求前置鏡頭權限...";

            try {
                faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });

                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: false,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                faceMesh.onResults(onFaceMeshResults);

                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await faceMesh.send({ image: videoElement });
                    },
                    facingMode: 'user',
                    width: 640,
                    height: 480
                });

                loadingText.innerText = "載入 AI 頭部追蹤模式...";
                await camera.start();
                
                resizeCanvas();
                loadingOverlay.classList.add('hidden');
                startModal.classList.add('hidden');
                
                startGame();
            } catch (err) {
                console.error(err);
                alert('無法啟動鏡頭，請確認是否已授權相機權限！');
                loadingOverlay.classList.add('hidden');
            }
        }

        function startGame() {
            lives = 3;
            apples = [];
            particles = [];
            updateLivesDisplay();
            startTime = performance.now();
            gameState = 'PLAYING';
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function updateLivesDisplay() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('i');
                if (i < lives) {
                    heart.className = 'fa-solid fa-heart text-red-500 text-base sm:text-xl animate-pulse';
                } else {
                    heart.className = 'fa-regular fa-heart text-amber-700/50 text-base sm:text-xl';
                }
                livesContainer.appendChild(heart);
            }
        }

        function spawnApple(now) {
            const container = canvasElement.parentElement;
            const renderW = container.clientWidth;

            const currentElapsedSec = (now - startTime) / 1000;
            const dynamicInterval = Math.max(300, spawnInterval - currentElapsedSec * 35);

            if (now - lastSpawnTime > dynamicInterval) {
                const radius = 16 + Math.random() * 8;
                const x = radius + Math.random() * (renderW - radius * 2);
                const speed = baseAppleSpeed + (currentElapsedSec * 0.16) + (Math.random() * 1.2);
                
                apples.push({
                    x: x,
                    y: -radius * 2,
                    radius: radius,
                    speed: speed,
                    rotation: Math.random() * Math.PI,
                    vRot: (Math.random() - 0.5) * 0.1
                });

                lastSpawnTime = now;
            }
        }

        function formatTime(ms) {
            const totalSec = ms / 1000;
            const mins = Math.floor(totalSec / 60);
            const secs = Math.floor(totalSec % 60);
            const millis = Math.floor((ms % 1000) / 10);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${millis.toString().padStart(2, '0')}`;
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const now = timestamp || performance.now();
            elapsedTime = now - startTime;

            timerDisplay.innerText = formatTime(elapsedTime);

            const container = canvasElement.parentElement;
            const renderW = container.clientWidth;
            const renderH = container.clientHeight;

            canvasCtx.clearRect(0, 0, renderW, renderH);

            // 繪製 WebCam 畫面
            canvasCtx.drawImage(videoElement, 0, 0, renderW, renderH);

            // 畫面半透明襯托
            canvasCtx.fillStyle = 'rgba(18, 12, 8, 0.2)';
            canvasCtx.fillRect(0, 0, renderW, renderH);

            // 平滑跟蹤頭部
            if (headPos.detected) {
                smoothedHead.x += (headPos.x - smoothedHead.x) * 0.35;
                smoothedHead.y += (headPos.y - smoothedHead.y) * 0.35;
                smoothedHead.width += (headPos.width - smoothedHead.width) * 0.35;
                smoothedHead.angle += (headPos.angle - smoothedHead.angle) * 0.35;

                drawNewtonWig(canvasCtx, smoothedHead.x, smoothedHead.y, smoothedHead.width, smoothedHead.angle);
            }

            spawnApple(now);

            // 定義假髮碰撞區
            const wigHitRadius = smoothedHead.width * 0.42;
            const wigHitCenterX = smoothedHead.x;
            const wigHitCenterY = smoothedHead.y;

            // 更新並繪製蘋果
            for (let i = apples.length - 1; i >= 0; i--) {
                let a = apples[i];
                a.y += a.speed;
                a.rotation += a.vRot;

                drawApple(canvasCtx, a);

                // 檢測碰撞
                if (headPos.detected) {
                    const dist = Math.hypot(a.x - wigHitCenterX, a.y - wigHitCenterY);
                    if (dist < a.radius + wigHitRadius) {
                        createExplosion(a.x, a.y);
                        apples.splice(i, 1);
                        
                        lives--;
                        updateLivesDisplay();

                        canvasCtx.fillStyle = 'rgba(230, 57, 70, 0.4)';
                        canvasCtx.fillRect(0, 0, renderW, renderH);

                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                        continue;
                    }
                }

                if (a.y - a.radius > renderH + 50) {
                    apples.splice(i, 1);
                }
            }

            updateAndDrawParticles(canvasCtx);

            // 未偵測到頭部提示 (因 Canvas scaled -1，文字需獨立反轉繪製)
            if (!headPos.detected) {
                canvasCtx.save();
                canvasCtx.translate(renderW / 2, 35);
                canvasCtx.scale(-1, 1);
                canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                canvasCtx.beginPath();
                canvasCtx.roundRect(-120, -18, 240, 36, 12);
                canvasCtx.fill();
                canvasCtx.fillStyle = '#ffb703';
                canvasCtx.font = 'bold 14px "Noto Sans TC"';
                canvasCtx.textAlign = 'center';
                canvasCtx.textBaseline = 'middle';
                canvasCtx.fillText('⚠️ 請將頭部位於鏡頭內！', 0, 0);
                canvasCtx.restore();
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            const finalMs = elapsedTime;
            const seconds = finalMs / 1000;

            finalTimeDisplay.innerText = formatTime(finalMs);

            let rank = "";
            let desc = "";

            if (seconds < 10) {
                rank = "🥉 萬有引力受害者";
                desc = "「地心引力太強了...蘋果一下就把牛頓擊倒了！」";
            } else if (seconds < 25) {
                rank = "🥈 蘋果敏捷閃避者";
                desc = "「不錯的反射神經！牛頓的頭髮保護得還算完好。」";
            } else if (seconds < 45) {
                rank = "🥇 經典物理學大師";
                desc = "「太強了！你成功掌握了蘋果掉落軌跡的萬有引力公式！」";
            } else {
                rank = "🏆 宇宙級·重力主宰者";
                desc = "「傳奇！牛頓在世都要向你的閃避動作致敬！」";
            }

            rankBadge.innerText = `稱號：${rank}`;
            rankDesc.innerText = desc;

            gameoverModal.classList.remove('hidden');
        }

        // 綁定按鈕點擊與觸控事件，確保手機瀏覽器精準觸發
        const handleStart = (e) => {
            if (e) e.preventDefault();
            initCameraAndFaceMesh();
        };

        const handleRestart = (e) => {
            if (e) e.preventDefault();
            gameoverModal.classList.add('hidden');
            startGame();
        };

        startBtn.addEventListener('click', handleStart);
        restartBtn.addEventListener('click', handleRestart);
    </script>
</body>
</html>
